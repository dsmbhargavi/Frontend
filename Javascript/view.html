<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./practice.js" defer></script>
    <style>
        div#grandparent , div#parent, div#child {
            min-height: 100px;
            border: 2px solid black;
            padding: 30px;
        }
        ul#parentcommers {
            margin-top: 200px;
            min-width: 500px;
            min-height: 200px;
            border: 2px solid black;
            padding: 30px;
            display: flex;
            align-items:center;
            gap: 20px;
        }
        li#laptop {
            width: 100%;
            height: 200px;
            border: 2px solid black;
            padding: 30px;
            list-style: none;
        }
        li#camera {
            width: 100%;
            height: 200px;
            border: 2px solid black;
            padding: 30px;
            list-style: none;
        }
        li#shoes {
            width: 100%;
            height: 200px;
            border: 2px solid black;
            padding: 30px;
            list-style: none;
        }
    </style>
</head>
<body style="position: relative;">
    <h1>Hello World !!!</h1>

    <div id="grandparent">
        <div id="parent">
            <div id="child"></div>
        </div>
    </div>


    <!-- event delegation -->
     <ul id="parentcommers">
        <li id="laptop">Laptop</li>
        <li id="camera">camera</li>
        <li id="shoes">shoes</li>
     </ul>

     <div id="form">
        <input type="text" id="name" data-uppercase >
        <input type="text" id="pan">
        <input type="text" id="mobile"></input>
     </div>



</body>
</html>
